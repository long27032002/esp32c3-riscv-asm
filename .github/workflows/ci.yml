# Continuous integration for the ESP32-C3 assembly template.
#
# WHAT CI CAN AND CANNOT DO HERE
#
# GitHub runners have no ESP32-C3 attached, so CI can never flash the board,
# drive JTAG, blink the LED or measure real cycle counts. Those remain manual
# checks, documented in the README.
#
# The program itself does run, though: the qemu job emulates the chip and
# checks the output, so a change that breaks the arithmetic or stops the
# tasks from starting fails here rather than on someone's desk.
#
# What CI does cover is everything that fails silently when a change looks
# harmless:
#
#   build       every example still compiles, with warnings treated as errors
#   qemu        the firmware actually runs, and prints the right answers
#   component   the component packs cleanly for the ESP Component Registry
#   generate    tools/setup.sh still produces valid VS Code configuration
#   leaks       no machine path, board serial number or key is committed
#   docs        Doxygen builds both languages with zero warnings
#   shell       the shell scripts are syntactically sound (shellcheck)
#   windows     the PowerShell scripts at least parse on a real Windows host
#
# The last job matters most: the development machine runs Linux, so without it
# the Windows scripts would ship completely unexercised.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  build:
    name: Build examples (ESP-IDF v5.3.5)
    runs-on: ubuntu-latest
    # Espressif's official image: ESP-IDF, the RISC-V toolchain, OpenOCD and
    # the python environment are already installed and IDF_PATH is set.
    container: espressif/idf:v5.3.5

    steps:
      - uses: actions/checkout@v4

      - name: Build every example
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh" >/dev/null
          # Warnings become errors: a template that ships with warnings
          # teaches people to ignore them.
          for ex in examples/*/; do
            echo "::group::$(basename "${ex}")"
            ( cd "${ex}" \
              && idf.py build -DEXTRA_CFLAGS="-Werror" -DEXTRA_CXXFLAGS="-Werror" \
              && idf.py size )
            echo "::endgroup::"
          done

      - name: A new project from the blank template must build too
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh" >/dev/null
          # The skeleton people start from is as much a deliverable as the
          # examples, and it is the one nobody notices when it breaks.
          ./tools/new-project.sh ci_smoke --dir "${RUNNER_TEMP}"
          ( cd "${RUNNER_TEMP}/ci_smoke" && idf.py build )

      - name: Check the assembly symbols really made it into the image
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh" >/dev/null
          elf=examples/hello_asm/build/hello_asm.elf
          # Read the symbol table once, then match against a here-string.
          # "nm | grep -q" looks natural but breaks under "set -o pipefail",
          # which GitHub sets for every bash step: grep -q exits at the first
          # match, closing the pipe, so nm dies of SIGPIPE (141) and the
          # pipeline is reported as failed even though the symbol was found.
          syms="$(riscv32-esp-elf-nm "${elf}")"
          missing=0
          for sym in asm_sum_loop asm_sum_closed_form asm_fill_table \
                     asm_gpio_output_init asm_read_misa g_result_table sum_loop
          do
            if grep -qw -- "${sym}" <<< "${syms}"; then
              echo "  ok      ${sym}"
            else
              echo "  MISSING ${sym}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            examples/hello_asm/build/hello_asm.bin
            examples/hello_asm/build/hello_asm.elf
            examples/hello_asm/build/hello_asm.map
          if-no-files-found: error

  # ---------------------------------------------------------------------
  qemu:
    name: Run the example on QEMU
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5

    steps:
      - uses: actions/checkout@v4

      # Espressif's QEMU links against libslirp, which the image does not
      # carry. Without it the binary unpacks and then fails to start with
      # "libslirp.so.0: cannot open shared object file".
      - name: Dependencies
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq libslirp0

      - name: Install the emulator
        shell: bash
        run: python "${IDF_PATH}/tools/idf_tools.py" install qemu-riscv32

      # No TTY on a runner, so idf_monitor cannot be used; qemu.sh notices and
      # lets QEMU write straight to stdout.
      - name: Run, with a time limit
        shell: bash
        run: |
          set +e
          timeout 180 ./tools/qemu.sh --no-monitor > qemu.log 2>&1
          echo "exit: $?"      # 124 from timeout is the expected outcome

      - name: The output must be right, not merely present
        shell: bash
        run: |
          # Strip the ANSI colouring the ESP-IDF log emits, or the patterns
          # below would have to match escape sequences too.
          log="$(sed 's/\x1b\[[0-9;]*m//g' qemu.log)"
          fail=0
          check() {
            if grep -qF -- "$2" <<< "${log}"; then
              echo "  ok      $1"
            else
              echo "  MISSING $1  (expected: $2)"
              fail=1
            fi
          }
          check "second-stage bootloader ran"  "2nd stage bootloader"
          check "app_main was reached"         "Calling app_main()"
          check "misa was read"                "misa = 0x"
          check "1 + 2 + ... + 55 = 1540"      "asm_sum_loop(55)         = 1540"
          check "both methods agree"           "self-check: PASS"
          check "the result table was filled"  "g_result_table at 0x"
          check "the example's own assembly"   "app_count_ones(0x0F0F0F0F)   = 16"
          check "byte reversal"                "app_reverse_bytes(0x12345678)= 0x78563412"
          check "the LED task is running"      "[led ]"
          check "the compute task is running"  "[calc] n=55 loop=1540"

          if grep -qE "Guru Meditation|rst:0x[0-9a-f]+ \\(.*WDT|abort\\(\\) was called" \
                  <<< "${log}"; then
            echo "  CRASH   the firmware panicked or was reset"
            fail=1
          else
            echo "  ok      no panic, no watchdog reset"
          fi
          exit "${fail}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-log
          path: qemu.log

  # ---------------------------------------------------------------------
  generate:
    name: setup.sh generates valid configuration
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5

    steps:
      - uses: actions/checkout@v4

      - name: Run setup.sh
        shell: bash
        run: |
          # No VS Code and no board on a runner, so --no-install keeps it from
          # trying to install anything; the generator is what we are testing.
          # ESP-IDF is found through IDF_PATH, which the image sets.
          ./tools/setup.sh --no-install

      - name: The generated files must be valid JSON with no placeholder left
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re, sys, pathlib
          failed = False
          root = pathlib.Path("examples/hello_asm/.vscode")
          for p in sorted(root.glob("*.json")):
              text = p.read_text(encoding="utf8")
              left = re.findall(r"@[A-Z_]+@", text)
              if left:
                  print(f"  FAIL {p.name}: unsubstituted placeholders {set(left)}")
                  failed = True
              try:
                  json.loads(re.sub(r"(?m)^\s*//.*$", "", text))
                  print(f"  ok   {p.name}")
              except Exception as exc:
                  print(f"  FAIL {p.name}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: The generated files must stay out of git
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          untracked="$(git status --porcelain --untracked-files=all \
                       | grep -E '\.vscode/(settings|launch|tasks)\.json' || true)"
          if [ -n "${untracked}" ]; then
            echo "generated files are not ignored:"
            echo "${untracked}"
            exit 1
          fi
          echo "  ok   .gitignore still covers the generated files"

  # ---------------------------------------------------------------------
  component:
    name: Component packs for the registry
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5

    steps:
      - uses: actions/checkout@v4

      - name: compote pack
        shell: bash
        run: |
          . "${IDF_PATH}/export.sh" >/dev/null
          cd components/esp32c3_riscv_asm
          # export.sh first: PyYAML lives in the ESP-IDF python environment,
          # not in the container's system python.
          version="$(python3 -c "
          import yaml; print(yaml.safe_load(open('idf_component.yml'))['version'])")"
          compote component pack --name esp32c3_riscv_asm --version "${version}"
          ls -la dist/

          # Published once, for the step that follows: it runs in a fresh
          # shell back at the repository root, and re-parsing the manifest
          # there would need the ESP-IDF environment all over again.
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: The archive must carry the sources and nothing generated
        shell: bash
        run: |
          # compote writes two archives when the manifest points at
          # examples outside the component, so the name has to be pinned
          # rather than globbed.
          d=components/esp32c3_riscv_asm/dist
          archive="${d}/esp32c3_riscv_asm_${VERSION}.tgz"
          listing="$(tar tzf "${archive}")"
          fail=0
          # README and LICENSE are what the registry page shows. 1.0.0 and
          # 1.0.1 shipped without them and the page came out blank, which
          # nothing in the build would have caught.
          for want in ./CMakeLists.txt ./riscv_asm.h ./riscv_asm.S \
                      ./README.md ./LICENSE; do
            if grep -qx -- "${want}" <<< "${listing}"; then
              echo "  ok      ${want}"
            else
              echo "  MISSING ${want}"; fail=1
            fi
          done
          # The example travels in its own archive; losing it would break
          # "idf.py create-project-from-example".
          ex="$(tar tzf "${d}/esp32c3_riscv_asm_${VERSION}_examples.tgz")"
          if grep -q 'hello_asm/main/app_asm.S' <<< "${ex}"; then
            echo "  ok      examples archive carries hello_asm"
          else
            echo "  MISSING hello_asm in the examples archive"; fail=1
          fi

          # A built example would otherwise ship its build directory: 1939 of
          # 1956 entries, the one time it was measured. CI checks out a clean
          # tree so it never reproduces that on its own - this guard is here
          # for the manifest's exclude list, not for the runner.
          ex_junk="$(grep -E '/(build|build-qemu|managed_components|\.vscode)/' \
                     <<< "${ex}" || true)"
          if [ -n "${ex_junk}" ]; then
            echo "  generated files leaked into the examples archive:"
            printf '%s\n' "${ex_junk}" | head -5 | sed 's/^/    /'
            fail=1
          else
            echo "  ok      no generated files in the examples archive"
          fi

          junk="$(grep -E '(^|/)(build|managed_components|\.vscode)/' \
                  <<< "${listing}" || true)"
          if [ -n "${junk}" ]; then
            echo "  generated files leaked into the archive:"
            printf '%s\n' "${junk}" | sed 's/^/    /'
            fail=1
          else
            echo "  ok      no generated files in the archive"
          fi
          exit "${fail}"

      - uses: actions/upload-artifact@v4
        with:
          name: component-archive
          path: components/esp32c3_riscv_asm/dist/*.tgz

  # ---------------------------------------------------------------------
  leaks:
    name: No machine-specific content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # check-release.sh greps the whole tree

      - run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          ./tools/check-release.sh

  # ---------------------------------------------------------------------
  docs:
    name: Doxygen builds with no warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # graphviz is optional for the project - build-docs.sh disables the
      # call graphs when dot is missing - but installing it here means CI
      # exercises the branch that actually generates them.
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Build both languages, fail on any warning
        run: ./tools/build-docs.sh

      - name: Must also build without Graphviz
        run: |
          # The common case for a new user: doxygen installed, graphviz not.
          sudo apt-get remove -y graphviz
          ./tools/build-docs.sh

      - name: All three entry points must exist
        run: |
          for f in docs/html/index.html docs/html/en/index.html \
                   docs/html/vi/index.html
          do
            test -f "$f" && echo "  ok   $f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html

  # ---------------------------------------------------------------------
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: for f in tools/*.sh; do bash -n "$f" && echo "  ok   $f"; done

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning tools/*.sh

      - name: Line endings must be LF
        run: |
          bad=0
          for f in tools/*.sh components/*/*.S components/*/*.h \
                   examples/*/main/* templates/*/main/*; do
            [ -f "$f" ] || continue
            if grep -qU $'\r' "$f"; then echo "  CRLF  $f"; bad=1; else echo "  ok   $f"; fi
          done
          exit "$bad"

  # ---------------------------------------------------------------------
  windows:
    name: PowerShell scripts parse on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse without executing
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem tools\*.ps1) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $f.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count -gt 0) {
                  Write-Host "  FAIL $($f.Name)"
                  $errors | ForEach-Object { Write-Host "        $_" }
                  $failed = $true
              } else {
                  Write-Host "  ok   $($f.Name)"
              }
          }
          if ($failed) { exit 1 }

      - name: Scripts must refuse to run without ESP-IDF, not crash
        shell: pwsh
        run: |
          # No ESP-IDF and no board on the runner, so the expected outcome is a
          # clean failure with a readable message, not a stack trace.
          $cases = @(
              @{ File = "tools\setup.ps1"; Args = @("-Check", "-NoInstall") },
              @{ File = "tools\qemu.ps1";  Args = @("-NoBuild") }
          )
          foreach ($c in $cases) {
              $out = & powershell -NoProfile -ExecutionPolicy Bypass `
                       -File $c.File @($c.Args) 2>&1 | Out-String
              Write-Host "---- $($c.File)"
              Write-Host $out
              if ($out -match 'ESP-IDF not found' -or $out -match '\[fail\]') {
                  Write-Host "  ok   $($c.File) failed cleanly as expected"
              } elseif ($out -match 'Exception|at line|ParserError') {
                  Write-Host "  FAIL $($c.File) crashed instead of reporting"
                  exit 1
              } else {
                  Write-Host "  note $($c.File): unexpected output, see above"
              }
          }
          # setup.ps1 exiting non-zero is the expected outcome here, but a pwsh
          # step inherits $LASTEXITCODE and would mark itself failed. Clear it.
          exit 0

      - name: Batch files must be CRLF
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem tools\*.bat) {
              $raw = [System.IO.File]::ReadAllText($f.FullName)
              if ($raw -match "[^`r]`n") {
                  Write-Host "  FAIL $($f.Name) contains a bare LF"
                  exit 1
              }
              Write-Host "  ok   $($f.Name)"
          }
